<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- App Logo -->
    <link rel="icon" href="/image.png" />
    <link rel="apple-touch-icon" href="/image.png" />

    <!-- PWA Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="theme-color" content="#f4edff" />
    <link rel="stylesheet" href="/launch.css" />
    <meta name="description" content="The Bethel Church - School Management System for Parents, Teachers, and Admins" />
    
    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bethel AMS" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Android/Chrome PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Bethel AMS" />
    
    <!-- Icons for all platforms -->
    <link rel="icon" type="image/png" sizes="192x192" href="/image.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/image.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/image.png" />
    
    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <title>The Bethel AMS</title>
  </head>
  <body>
    <div id="app-launch-screen" class="app-launch-screen" role="status" aria-live="polite" aria-label="Opening Bethel Attendance App">
      <span class="launch-orb" aria-hidden="true"></span><span class="launch-star" aria-hidden="true">✦</span><span class="launch-star" aria-hidden="true">✧</span>
      <div class="launch-card">
        <img class="launch-logo" src="/image.png" alt="" width="100" height="100" />
        <h1>Bethel</h1><p class="launch-subtitle">Attendance App</p>
        <img class="launch-landscape" src="/art/hero.jpg" alt="" width="941" height="209" />
        <p id="app-launch-message" class="launch-message">A new day to learn and grow</p>
        <div class="launch-track" aria-hidden="true"><i></i></div>
        <div id="app-launch-slow" class="launch-slow" hidden>Taking a little longer. Check your connection.<button type="button" onclick="window.location.reload()">Try opening again</button></div>
      </div>
      <span class="launch-footer">THE BETHEL CHURCH · SUNDAY SCHOOL</span>
    </div>
    <div id="root"></div>
    <script>
      window.setTimeout(() => {
        const launch = document.getElementById('app-launch-screen');
        if (launch && !launch.dataset.dismissed) document.getElementById('app-launch-slow').hidden = false;
      }, 12000);
    </script>
    <noscript><style>.app-launch-screen{display:none}</style><p>Please enable JavaScript to open Bethel Attendance App.</p></noscript>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register Service Worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const isLocalhost =
            location.hostname === 'localhost' ||
            location.hostname === '127.0.0.1' ||
            location.hostname === '[::1]';

          // In dev/localhost, a service worker will cache JS and show old UI until reload.
          // So we unregister and clear caches to always show the latest code.
          if (isLocalhost) {
            navigator.serviceWorker.getRegistrations().then((regs) => {
              regs.filter((r) => !r.scope.includes('firebase-cloud-messaging-push-scope')).forEach((r) => r.unregister());
            });
            if (window.caches) {
              caches.keys().then((keys) => keys.filter(k => k.startsWith('bethel-ams-')).forEach((k) => caches.delete(k)));
            }
            return;
          }

          navigator.serviceWorker
            .register('/sw.js', { scope: '/', updateViaCache: 'none' })
            .then((registration) => {
              // Proactively check for updates
              if (registration.update) registration.update();

              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                if (!newWorker) return;
                newWorker.addEventListener('statechange', () => {
                  // Do not replace the running app while attendance or other forms
                  // contain unsaved changes. The update activates after tabs close.
                });
              });
            })
            .catch(() => {
              // ignore
            });
        });
      }

      // Store deferred prompt globally for install
      let deferredPrompt;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        window.deferredPrompt = e;
        console.log('Install prompt available');
      });

      // Track app installation
      window.addEventListener('appinstalled', (evt) => {
        console.log('App installed successfully');
        deferredPrompt = null;
        window.deferredPrompt = null;
      });
    </script>
  </body>
</html>
